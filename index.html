<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="witdh=device-Width, initial-scale=1.0">
        <title>VR + Interfaz Cerebro-Computadora (BCI) - Demo</title>
        <link rel="stylesheet" href="style.css">
        <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    </head>

    <body>
        <div id="panel">
            <h1>🧠 Diagrma BCI (simulada)</h1>

            <div class="metric">
                <label>Atención <span id="attn-v">0%</span></label>
                <div class="bar" id="attn"><span></span></div>
            </div>

            <div class="metric">
                <label>Meditación <span id="medi-v">0%</span></label>
                <div class="bar idmedi"><span></span></div>
            </div>

            <button id="connect">Conectar dispositivo</button>
            <button id="blink" class="off">Simular parpadeo (acción). <kbd>Espacio</kbd></button>

            <div class="status" id="status">
                Estado: <b>desconectado</b><br>
                - La <b>atención</b> eleve y agranda la esfera.<br>
                - La <b>meditación</b> cambia su color (frío -> cálido). <br>
                - Un <b>parpadeo</b> dispara un pulso/teletransporte. <br>
                <b>Hecho por: Luis Guillermo Solidoro Cueto. </b>
            </div>
        </div>

        <a-scene backhground="color: #0067BF" renderer="colorManagement: true">
            <a-entity id="rig" position="0 1.6 4">
                <a-camera wasd-controls look.controls></a-camera>
            </a-entity>

            <a-light type="ambient" color="#445"></a-light>
            <a-light type="point" intensity="0.9" position="3 4 4"></a-light>

            <a-plane rotation="-90 0 0" width="40" heigth="40" color="#008C3C"
            material="shader: flat"></a-plane>

            <a-sphere id="orb2" position="1 5 -3" radius="0.6" color="#F43B2A"
                material="metalness:0.3; roughness:0.4">
                <a-animation attribute="rotation" to="0 360 0" dur="8000"
                    repeat="indefinite" easing="linear"></a-animation>
            </a-sphere>

            <a-sphere id="orb" position="-1 5 -3" radius="0.6" color="#0815BF"
                material="metalness:0.3; roughness:0.4">
                <a-animation attribute="rotation" to="0 360 0" dur="8000"
                    repeat="indefinite" easing="linear"></a-animation>
            </a-sphere>
            
            <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9"
                animation="property: position; to: -1 1.1 -3; dir: alternate; dur: 1800; loop: true; easing: easeInOutSine">
            </a-box>
            
            <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>

            <a-ring id="pulse" position="0 1.5 -3" radis-inner="0.7" radius-outer="0.8"
                color="#3ad6c0" visible="false" material="shader: flat; opacity: 0.8; transparent: true"></a-ring>

            <a-text id="hud3d" value="" position="-12. 2.6 -3" color="#fff" width="4"></a-text>
        </a-scene>
        <script src="script.js"></script>
    </body>
</html>
